name: LLM accuracy

# Generates real study plans with the live model and grades them with the
# deterministic oracle in tests/e2e. Slow and billed, so it runs only when
# something that shapes a plan changes, nightly, or on demand -- never on every PR.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Plans generated per case
        default: "3"
      filter:
        description: pytest -k expression (e.g. bcs_25 or lp)
        default: ""
  schedule:
    - cron: "0 17 * * *"
  pull_request:
    branches:
      - main
    paths:
      - app/prompts/**
      - app/agents/**
      - app/services/**
      - app/knowledge/**
      - seeds/**
      - tests/e2e/**

permissions:
  contents: read

concurrency:
  group: e2e-llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accuracy:
    name: Plan accuracy (live model)
    # Fork PRs get no secrets, so there is nothing to run against.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg_async://ci:ci@127.0.0.1:5432/ci
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Migrate and seed the handbook data
        run: |
          python -m alembic upgrade head
          python -m seeds.seed

      - name: Grade generated plans
        env:
          RUNS: ${{ inputs.runs || '3' }}
          FILTER: ${{ inputs.filter }}
        run: python -m pytest tests/e2e --llm=gemini --e2e-runs="$RUNS" -k "${FILTER:-bcs}" -q -rf
