services:
  # The local database .env.example points at (port 5433, so it can't collide
  # with a Postgres you already run on 5432).
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: intellistudy
      POSTGRES_PASSWORD: password
      POSTGRES_DB: intellistudy
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellistudy -d intellistudy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "7777:7777"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
