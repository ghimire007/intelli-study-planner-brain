<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntelliStudy Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1rem; font-weight: 600; }

    #session-info { font-size: 0.75rem; color: #aaa; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    #new-chat-btn {
      background: #e74c3c;
      color: white;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: white;
    }

    .message.assistant {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
      color: #111;
    }

    .message .meta {
      margin-top: 6px;
      font-size: 0.7rem;
      color: #888;
    }

    .message.user .meta { color: #aac; }

    table {
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 0.85rem;
      width: 100%;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px 10px;
      text-align: left;
    }

    th { background: #f0f0f0; }

    footer {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px 20px;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      resize: none;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      height: 80px;
    }

    #input:focus { outline: none; border-color: #1a1a2e; }

    #send-btn {
      background: #1a1a2e;
      color: white;
      align-self: flex-end;
      padding: 10px 20px;
    }

    #loading {
      display: none;
      align-self: flex-start;
      color: #888;
      font-size: 0.85rem;
      padding: 8px 0;
    }

    /* ── Test Scenarios Panel ── */
    #test-panel {
      display: none;
      background: #fff;
      border-bottom: 2px solid #1a1a2e;
      /* stretch past #chat's 20px padding to hit the edges */
      margin: -20px -20px 0 -20px;
      padding: 14px 20px 0;
      gap: 12px;
      flex-direction: column;
      position: sticky;
      top: -20px;
      z-index: 10;
      flex-shrink: 0;
    }

    /* scrollable area inside the sticky panel */
    #test-panel-body {
      overflow-y: auto;
      max-height: 340px;
      padding-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #test-panel.open { display: flex; }

    #test-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #test-panel-header h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1a1a2e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #test-panel-close {
      background: none;
      color: #888;
      font-size: 1.1rem;
      padding: 2px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    #test-panel-close:hover { background: #f0f0f0; }

    #scenario-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #scenario-select {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.875rem;
      font-family: inherit;
      background: #fafafa;
    }

    #load-scenario-btn {
      background: #1a1a2e;
      color: white;
      white-space: nowrap;
      padding: 8px 16px;
    }

    #load-scenario-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #scenario-preview {
      display: none;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      flex-direction: column;
    }

    #scenario-preview.visible { display: flex; }

    #preview-meta {
      background: #f7f8fc;
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 24px;
    }

    .meta-row { font-size: 0.8rem; color: #333; }
    .meta-row strong { color: #1a1a2e; }

    .meta-note {
      grid-column: 1 / -1;
      margin-top: 6px;
      font-size: 0.78rem;
      color: #555;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 6px 10px;
    }

    #preview-sols-wrap {
      position: relative;
      max-height: 140px;
      overflow: hidden;
    }

    /* full-screen modal for SOLS record */
    #sols-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
    }

    #sols-modal.open { display: flex; }

    #sols-modal-box {
      background: #fff;
      border-radius: 10px;
      width: 90vw;
      max-width: 860px;
      height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    }

    #sols-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    #sols-modal-header h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a1a2e;
    }

    #sols-modal-close {
      background: none;
      border: 1px solid #ddd;
      color: #555;
      font-size: 1.1rem;
      padding: 2px 10px;
      border-radius: 4px;
    }

    #sols-modal-close:hover { background: #f0f0f0; }

    #sols-modal-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      font-size: 0.82rem;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      color: #222;
    }

    #preview-sols {
      margin: 0;
      padding: 12px 16px;
      font-size: 0.75rem;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
      color: #222;
      line-height: 1.5;
      background: #fff;
    }

    #sols-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      background: linear-gradient(transparent, #fff);
      pointer-events: none;
    }

    #preview-sols-wrap.expanded #sols-fade { display: none; }

    #toggle-sols-btn {
      background: none;
      color: #1a1a2e;
      font-size: 0.75rem;
      padding: 4px 16px 8px;
      text-decoration: underline;
      border-radius: 0;
      align-self: flex-start;
    }

    #dev-tools-btn {
      background: #2d2d4e;
      color: #aab;
      font-size: 0.75rem;
      padding: 5px 12px;
      border: 1px solid #444;
    }

    #dev-tools-btn:hover { background: #3a3a5e; }
  </style>
</head>
<body>

<header>
  <h1>IntelliStudy Planner — UOW CS 766</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="session-info">No active session</span>
    <button id="dev-tools-btn" onclick="toggleTestPanel()">Test Scenarios</button>
    <button id="new-chat-btn" onclick="newChat()">New Chat</button>
  </div>
</header>

<div id="chat">
  <!-- ── Test Scenarios Panel ── -->
  <div id="test-panel">
    <div id="test-panel-header">
      <h2>Test Scenarios</h2>
      <button id="test-panel-close" onclick="toggleTestPanel()" title="Close">&#x2715;</button>
    </div>

    <div id="test-panel-body">
      <div id="scenario-row">
        <select id="scenario-select" onchange="onScenarioChange()">
          <option value="">— pick a scenario —</option>
        </select>
        <button id="load-scenario-btn" disabled onclick="loadScenario()">Load into Input</button>
      </div>

      <div id="scenario-preview">
        <div id="preview-meta"></div>
        <div id="preview-sols-wrap">
          <pre id="preview-sols"></pre>
          <div id="sols-fade"></div>
        </div>
        <button id="toggle-sols-btn" onclick="toggleSolsExpand()">Show full record</button>
      </div>
    </div>
  </div>
</div>
<div id="loading">Assistant is thinking...</div>

<!-- SOLS full-screen modal -->
<div id="sols-modal" onclick="onModalKey({key:'Escape'})">
  <div id="sols-modal-box" onclick="event.stopPropagation()">
    <div id="sols-modal-header">
      <h3 id="sols-modal-title">SOLS Record</h3>
      <button id="sols-modal-close" onclick="onModalKey({key:'Escape'})">&#x2715;</button>
    </div>
    <pre id="sols-modal-content"></pre>
  </div>
</div>

<footer>
  <textarea
    id="input"
    placeholder="Paste your SOLS enrolment record here to start, or type a follow-up question..."
    onkeydown="handleKey(event)"
  ></textarea>
  <button id="send-btn" onclick="send()">Send</button>
</footer>

<script>
  let sessionId = localStorage.getItem('session_id');

  // Restore existing session on load
  if (sessionId) {
    updateSessionInfo(sessionId);
    loadHistory(sessionId);
  }

  async function send() {
    const input = document.getElementById('input');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    appendMessage('user', message);
    setLoading(true);

    try {
      if (!sessionId) {
        const data = await post('/api/v1/chat', { message });
        sessionId = data.session_id;
        localStorage.setItem('session_id', sessionId);
        updateSessionInfo(sessionId);
        appendMessage('assistant', data.reply.content, data.reply);
      } else {
        const data = await post(`/api/v1/chat/${sessionId}`, { message });
        appendMessage('assistant', data.reply.content, data.reply);
      }
    } catch (err) {
      appendMessage('assistant', `Error: ${err.message}`);
    } finally {
      setLoading(false);
    }
  }

  async function loadHistory(id) {
    try {
      const res = await fetch(`/api/v1/chat/${id}`);
      if (!res.ok) { newChat(); return; }
      const data = await res.json();
      data.messages.forEach(m => appendMessage(m.role, m.content, m));
    } catch {
      newChat();
    }
  }

  function newChat() {
    localStorage.removeItem('session_id');
    sessionId = null;
    document.querySelectorAll('#chat .message').forEach(el => el.remove());
    updateSessionInfo(null);
  }

  function appendMessage(role, content, meta = null) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = renderContent(content);

    if (meta && (meta.cost_usd !== null && meta.cost_usd !== undefined)) {
      const metaDiv = document.createElement('div');
      metaDiv.className = 'meta';
      metaDiv.textContent = [
        meta.model ? `model: ${meta.model}` : '',
        meta.tokens_in != null ? `in: ${meta.tokens_in}` : '',
        meta.tokens_out != null ? `out: ${meta.tokens_out}` : '',
        meta.cached_tokens ? `cached: ${meta.cached_tokens}` : '',
        meta.cost_usd != null ? `cost: $${Number(meta.cost_usd).toFixed(6)}` : '',
      ].filter(Boolean).join(' · ');
      div.appendChild(metaDiv);
    }

    chat.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth' });
  }

  function renderContent(text) {
    // Render markdown tables as HTML tables
    const lines = text.split('\n');
    let html = '';
    let inTable = false;
    let tableHtml = '';

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (line.trim().startsWith('|')) {
        if (!inTable) { inTable = true; tableHtml = '<table>'; }
        const isHeader = lines[i + 1] && lines[i + 1].trim().match(/^\|[-| :]+\|$/);
        const isSeparator = line.trim().match(/^\|[-| :]+\|$/);
        if (isSeparator) continue;
        const cells = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        const tag = isHeader ? 'th' : 'td';
        tableHtml += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
      } else {
        if (inTable) { html += tableHtml + '</table>'; inTable = false; tableHtml = ''; }
        html += line + '\n';
      }
    }
    if (inTable) html += tableHtml + '</table>';

    return `<span>${html.trim()}</span>`;
  }

  function setLoading(show) {
    document.getElementById('loading').style.display = show ? 'block' : 'none';
    document.getElementById('send-btn').disabled = show;
  }

  function updateSessionInfo(id) {
    document.getElementById('session-info').textContent = id
      ? `Session: ${id.slice(0, 8)}...`
      : 'No active session';
  }

  async function post(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || res.statusText);
    }
    return res.json();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  }

  // ── Test Scenarios ──────────────────────────────────────────────

  let _testRecords = [];

  async function toggleTestPanel() {
    const panel = document.getElementById('test-panel');
    const isOpen = panel.classList.toggle('open');
    if (isOpen && _testRecords.length === 0) await fetchTestRecords();
  }

  async function fetchTestRecords() {
    try {
      const res = await fetch('/api/v1/test-records');
      if (!res.ok) throw new Error('Failed to load test records');
      _testRecords = await res.json();
      const sel = document.getElementById('scenario-select');
      _testRecords.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = r.label;
        sel.appendChild(opt);
      });
    } catch (err) {
      console.error(err);
    }
  }

  function onScenarioChange() {
    const sel = document.getElementById('scenario-select');
    const record = _testRecords.find(r => r.id === sel.value);
    const loadBtn = document.getElementById('load-scenario-btn');
    const preview = document.getElementById('scenario-preview');

    if (!record) {
      loadBtn.disabled = true;
      preview.classList.remove('visible');
      return;
    }

    loadBtn.disabled = false;
    preview.classList.add('visible');
    renderPreviewMeta(record);
    renderPreviewSols(record.content);

    // reset expand state
    document.getElementById('preview-sols-wrap').classList.remove('expanded');
    document.getElementById('toggle-sols-btn').textContent = 'Show full record';
  }

  function renderPreviewMeta(r) {
    const flags = [];
    if (r.note) flags.push(r.note);
    if (r.second_major) flags.push(`Second Major: ${r.second_major}`);
    if (r.honours_gpa) flags.push(`Honours GPA: ${r.honours_gpa}`);

    document.getElementById('preview-meta').innerHTML = `
      <div class="meta-row"><strong>Student</strong> ${esc(r.student)}</div>
      <div class="meta-row"><strong>Course</strong> ${esc(r.course)}</div>
      <div class="meta-row"><strong>Major</strong> ${esc(r.major)}</div>
      <div class="meta-row"><strong>Delivery</strong> ${esc(r.delivery)}</div>
      ${flags.map(f => `<div class="meta-note">${esc(f)}</div>`).join('')}
    `;
  }

  function renderPreviewSols(content) {
    // strip markdown bold/italic markers for readable display
    const clean = content.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1');
    document.getElementById('preview-sols').textContent = clean;
  }

  function toggleSolsExpand() {
    const sel = document.getElementById('scenario-select');
    const record = _testRecords.find(r => r.id === sel.value);
    if (!record) return;
    const clean = record.content.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1');
    document.getElementById('sols-modal-title').textContent = record.label + ' — Full SOLS Record';
    document.getElementById('sols-modal-content').textContent = clean;
    document.getElementById('sols-modal').classList.add('open');
    document.addEventListener('keydown', onModalKey);
  }

  function closeSolsModal(e) {
    // allow: direct close button click, Escape key, or backdrop click
    if (e && e.currentTarget === e.target && e.target.id !== 'sols-modal') return;
    document.getElementById('sols-modal').classList.remove('open');
    document.removeEventListener('keydown', onModalKey);
  }

  function onModalKey(e) {
    if (e.key === 'Escape') {
      document.getElementById('sols-modal').classList.remove('open');
      document.removeEventListener('keydown', onModalKey);
    }
  }

  function loadScenario() {
    const sel = document.getElementById('scenario-select');
    const record = _testRecords.find(r => r.id === sel.value);
    if (!record) return;
    const input = document.getElementById('input');
    input.value = record.content;
    input.focus();
    // close panel
    document.getElementById('test-panel').classList.remove('open');
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
</script>

</body>
</html>
